name: Build IMZYY XL LITE (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - '**/scripts/**'
      - '**/android/**'
      - '**/android-overlay/**'
      - '.github/workflows/android-lite.yml'

permissions:
  contents: write   # needed only to publish a GitHub Release on v* tags

jobs:
  build-imzyy:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      IMZYY_GITHUB_REPO: ${{ github.repository }}
      IMZYY_VARIANT: lite
    steps:
      - name: Checkout IMZYY project
        uses: actions/checkout@v4

      - name: Locate project folder
        id: loc
        shell: bash
        run: |
          set -euo pipefail
          f="$(find . -name prepare-imzyy.py -path '*/scripts/*' -not -path './.git/*' | head -n 1)"
          if [ -z "$f" ]; then
            echo "scripts/prepare-imzyy.py tidak ditemukan di repo. Upload isi folder proyek IMZYY." >&2
            exit 1
          fi
          dir="$(dirname "$(dirname "$f")")"
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-lite-${{ runner.os }}-${{ hashFiles('**/scripts/**', '**/android-overlay/**', '**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-lite-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'

      - name: Validate scripts and committed source
        working-directory: ${{ steps.loc.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare-imzyy.py scripts/test-integration.py
          rm -rf scripts/__pycache__
          bash -n scripts/build-imzyy.sh scripts/github-setup.sh scripts/trigger-github-run.sh
          git show --check --oneline HEAD

      - name: Test IMZYY patcher
        working-directory: ${{ steps.loc.outputs.dir }}
        run: python3 scripts/test-integration.py

      - name: Fetch open-source runtime and build IMZYY XL
        working-directory: ${{ steps.loc.outputs.dir }}
        run: bash scripts/build-imzyy.sh all

      - name: Upload Gradle log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: ${{ steps.loc.outputs.dir }}/output/gradle.log
          if-no-files-found: ignore

      - name: Upload upstream source snippets (for debugging in-game buttons / downloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-snippets
          path: |
            ${{ steps.loc.outputs.dir }}/.build/FlameLauncher-Android/app/src/main/java/**/KeyboardLayout*.kt
            ${{ steps.loc.outputs.dir }}/.build/FlameLauncher-Android/app/src/main/java/**/GameControllerView.kt
            ${{ steps.loc.outputs.dir }}/.build/FlameLauncher-Android/app/src/main/java/**/MinecraftActivity.kt
            ${{ steps.loc.outputs.dir }}/.build/FlameLauncher-Android/app/src/main/java/**/*Download*.kt
            ${{ steps.loc.outputs.dir }}/.build/FlameLauncher-Android/app/src/main/java/**/*Install*.kt
          if-no-files-found: ignore
          retention-days: 7

      - name: APK size report
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          ls -lh output/*.apk
          echo "### APK size: $(du -h output/IMZYY-XL-Lite-arm64-debug.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK, provenance and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: IMZYY-XL-Lite-ARM64-debug
          path: |
            ${{ steps.loc.outputs.dir }}/output/IMZYY-XL-Lite-arm64-debug.apk
            ${{ steps.loc.outputs.dir }}/output/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Java runtimes (downloaded by the app on demand)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtimes
          name: Java runtimes (auto)
          body: Dipakai otomatis oleh IMZYY XL Lite untuk mengunduh Java 8, 17 dan 25 saat dibutuhkan. Jangan dihapus.
          prerelease: true
          make_latest: false
          files: ${{ steps.loc.outputs.dir }}/output/runtimes/*.zip

      - name: Publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.loc.outputs.dir }}/output/IMZYY-XL-Lite-arm64-debug.apk
          generate_release_notes: true
