
name: Build IMZYY KNOX Game Turbo v5.1

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source

          ZIP=$(find . -maxdepth 1 -name "*.zip" -print -quit)

          if [ -n "$ZIP" ]; then
            unzip -oq "$ZIP" -d source
          else
            echo "No ZIP found. Checking repository files..."
          fi

          SETTINGS=$(find . \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found!"
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Project detected: $PROJECT"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "Android SDK 35 is missing."
            echo "Installing SDK 35..."

            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit)

            if [ -z "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager unavailable!"
              exit 1
            fi

            yes | "$SDKMANAGER" --licenses || true

            "$SDKMANAGER" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi

          echo "Android SDK 35 ready."

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IMZYY-Build-Log
          path: build-log.txt
          if-no-files-found: warn

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IMZYY-KNOX-GameTurbo-v5.1-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
