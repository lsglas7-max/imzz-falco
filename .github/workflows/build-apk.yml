name: Build IMZYY KNOX Game Turbo APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cari project Android di mana pun posisinya (root, subfolder, atau di dalam file .zip).
      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -eu
          for z in $(find . -maxdepth 2 -type f -name '*.zip' -not -path './.git/*'); do
            d="_unzipped/$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -oq "$z" -d "$d" || true
            echo "Extracted $z -> $d"
          done

          SETTINGS="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' -not -path '*/node_modules/*' -not -path '*/build/*' | sort | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle tidak ditemukan di repo. Upload isi project (bukan folder kosong)."
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          if [ ! -d "$DIR/app" ]; then
            echo "::error::Folder app/ tidak ada di $DIR"
            ls -la "$DIR"
            exit 1
          fi
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          if [ -f "$DIR/gradlew" ]; then echo "wrapper=true" >> "$GITHUB_OUTPUT"; else echo "wrapper=false" >> "$GITHUB_OUTPUT"; fi

      # Runner ubuntu-latest sudah bawa Android SDK. AGP akan mengunduh komponen yang kurang,
      # asal lisensi sudah di-accept. Langkah ini sengaja tidak fatal.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SM" ]; then
            yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          else
            echo "sdkmanager tidak ditemukan; lanjut, AGP akan menangani sendiri."
          fi

      - name: Set up Gradle (fallback jika tidak ada wrapper)
        if: steps.locate.outputs.wrapper == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -o pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE=./gradlew
          else
            GRADLE=gradle
          fi
          $GRADLE assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      # Kalau build gagal, tampilkan error aslinya di ringkasan run supaya tidak perlu scroll log.
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build gagal - error utama"
            echo '```'
            grep -nE "error:|FAILURE:|What went wrong|Execution failed|cannot find symbol|already defined|AAPT|Manifest merger" build-log.txt | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IMZYY-KNOX-GameTurbo-debug-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
