name: Build IMZYY KNOX Game Turbo APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d ./_project
          fi

          SETTINGS_FILE="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' -not -path './.gradle/*' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts tidak ditemukan."
            echo "Pastikan ZIP project atau folder project ada di repository."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Modul app/ tidak ditemukan di $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 2 -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_DIR"
          echo "Isi root project:"
          ls -la "$PROJECT_DIR"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK bawaan runner tidak ditemukan."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan di $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"
          APP_GRADLE_KTS="$PROJECT_DIR/app/build.gradle.kts"
          GRADLE_FILES=()
          [ -f "$APP_GRADLE" ] && GRADLE_FILES+=("$APP_GRADLE")
          [ -f "$APP_GRADLE_KTS" ] && GRADLE_FILES+=("$APP_GRADLE_KTS")

          COMPILE_SDK=""
          if [ ${#GRADLE_FILES[@]} -gt 0 ]; then
            COMPILE_SDK="$(grep -hEo 'compileSdk(Version)?[[:space:]()]*(=)?[[:space:]]*[0-9]+' "${GRADLE_FILES[@]}" \
              | grep -Eo '[0-9]+' | tail -1 || true)"
          fi

          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK=35
            echo "compileSdk tidak terbaca otomatis; memakai fallback android-35."
          fi

          echo "Installing platform android-$COMPILE_SDK"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-$COMPILE_SDK"

      - name: Set up Gradle when wrapper is missing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "Project directory belum tersedia; melewati setup Gradle fallback."
            exit 0
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle Wrapper tidak ada; menyiapkan Gradle 8.9 sebagai fallback."
            echo "GRADLE_FALLBACK=true" >> "$GITHUB_ENV"
          else
            echo "Gradle Wrapper ditemukan."
            echo "GRADLE_FALLBACK=false" >> "$GITHUB_ENV"
          fi

      - name: Install fallback Gradle
        if: env.GRADLE_FALLBACK == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build_apk
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -uo pipefail
          set +e

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
            BUILD_STATUS=${PIPESTATUS[0]}
          else
            gradle assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
            BUILD_STATUS=${PIPESTATUS[0]}
          fi

          exit "$BUILD_STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IMZYY-Build-Log
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IMZYY-KNOX-GameTurbo-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

