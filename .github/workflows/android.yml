name: Android Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          GALAXY_AI_API_URL: ${{ vars.GALAXY_AI_API_URL }}
          GALAXY_AI_API_URL_2: ${{ vars.GALAXY_AI_API_URL_2 }}
          GALAXY_VISION_API_URL: ${{ vars.GALAXY_VISION_API_URL }}
        run: gradle assembleDebug -PgalaxyAiApiUrl="$GALAXY_AI_API_URL" -PgalaxyAiApiUrl2="$GALAXY_AI_API_URL_2" -PgalaxyVisionApiUrl="$GALAXY_VISION_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-autopilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
