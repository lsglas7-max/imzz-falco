name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v4 no longer requests Google's removed "tools" SDK package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src/main
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build debug APK (save full log)
        env:
          GALAXY_AI_API_URL: ${{ vars.GALAXY_AI_API_URL }}
          GALAXY_AI_API_URL_2: ${{ vars.GALAXY_AI_API_URL_2 }}
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug \\
            -PgalaxyAiApiUrl="$GALAXY_AI_API_URL" \\
            -PgalaxyAiApiUrl2="$GALAXY_AI_API_URL_2" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "Gradle build failed with exit code $status"
            echo "===== LAST 250 LINES OF build.log ====="
            tail -n 250 build.log
            exit "$status"
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-autopilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-autopilot-build-log
          path: build.log
          if-no-files-found: ignore
